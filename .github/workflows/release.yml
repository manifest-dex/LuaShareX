name: Release

# Pushing a tag like v1.0.0 builds the app and publishes a GitHub Release
# with the win-x64 zip the in-app updater looks for.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish win-x64
        run: dotnet publish LuaShareX.csproj -c Release -r win-x64 --self-contained false -o publish

      - name: Zip portable artifact
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath "LuaShareX-${{ github.ref_name }}-win-x64.zip"

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $ver = "${{ github.ref_name }}".TrimStart("v")
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=$ver installer.iss

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            LuaShareX-*-win-x64.zip
            dist/LuaShareX-Setup-*-win-x64.exe
          generate_release_notes: true
